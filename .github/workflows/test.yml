name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Verify package metadata and source tree
        run: node scripts/verify-package.mjs
      - name: Run unit tests
        run: node --test
      - name: Check JavaScript syntax
        run: node --check index.js && node --check src/semantic-cache.js && node --check src/plugin-runtime.js
      - name: Package dry run
        run: npm pack --dry-run
