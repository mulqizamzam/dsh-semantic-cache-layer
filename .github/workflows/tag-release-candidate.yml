name: Tag release candidate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.head_commit.message == 'release: create v0.2.1-rc.2 tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and publish the immutable release-candidate tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'refs/tags/v0.2.1-rc.2' >/dev/null; then
            echo 'Tag v0.2.1-rc.2 already exists; refusing to rewrite it.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.2.1-rc.2 -m 'DSH Semantic Cache Layer 0.2.1-rc.2'
          git push origin refs/tags/v0.2.1-rc.2
